  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200

[[headers]]
  for = "/community"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-src https://app.jotform.com; frame-ancestors 'self'; base-uri 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/community.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-src https://app.jotform.com; frame-ancestors 'self'; base-uri 'self'; upgrade-insecure-requests"
