[build]
  publish = "_site"
  command = "node build-site.mjs"
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.images]
  compress = true

[[redirects]]
  from = "/Calendar"
  to = "/Calendar.html"
  status = 200

[[redirects]]
  from = "/booking"
  to = "/booking.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/booking"
  status = 301
  force = true

[[redirects]]
  from = "/register.html"
  to = "/booking"
  status = 301
  force = true

[[redirects]]
  from = "/capoeira"
  to = "/#classes"
  status = 301

[[redirects]]
  from = "/classes"
  to = "/#classes"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
from = "/walnut-creek"
to = "/#local-seo"
status = 301

[[redirects]]
  from = "/salsa-social"
  to = "/salsa-social.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-ancestors 'self'; base-uri 'self'; upgrade-insecure-requests"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/agreements.json"]

[[redirects]]
  from = "/register-family"
  to = "/register-family.html"
  status = 200
[[redirects]]
  from = "/family-sign"
  to = "/family-sign.html"
  status = 200

[[headers]]
  for = "/register-family"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/register-family.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/family-sign"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/family-sign.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/family.js"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/family-sign.js"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/family-pdf.js"
